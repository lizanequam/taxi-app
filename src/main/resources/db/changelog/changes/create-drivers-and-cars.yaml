databaseChangeLog:
  - changeSet:
      id: create-drivers-table
      author: developer
      changes:
        - createTable:
            tableName: drivers
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: email, type: VARCHAR(255), constraints: { nullable: false, unique: true } }
              - column: { name: phone, type: VARCHAR(50), constraints: { nullable: false, unique: true } }
              - column: { name: is_deleted, type: BOOLEAN, defaultValueBoolean: false }
              - column: { name: created_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }

  - changeSet:
      id: create-cars-table
      author: developer
      changes:
        - createTable:
            tableName: cars
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true, nullable: false } }
              - column: { name: driver_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: color, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: brand, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: plate, type: VARCHAR(20), constraints: { nullable: false, unique: true } }
              - column: { name: is_deleted, type: BOOLEAN, defaultValueBoolean: false }
              - column: { name: created_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }
        # внешний ключ и проверка на белорусский формат номеров:
        # для легковых 4 цифры, 2 буквы, 1 цифра (1234AB5)
        # для электричек E-3 цифры-2 буквы-1 цифра (E123AB4)
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE cars ADD CONSTRAINT fk_cars_driver FOREIGN KEY (driver_id) REFERENCES drivers(id) ON DELETE CASCADE;
              ALTER TABLE cars ADD CONSTRAINT chk_plate_format CHECK (plate ~ '^(\d{4}[\s-]?[A-Z]{2}[\s-]?\d|E[\s-]?\d{3}[\s-]?[A-Z]{2}[\s-]?\d)$');